apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "repository-tool.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "repository-tool.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "repository-tool.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "repository-tool.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.env.port | int }}
              protocol: TCP
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "repository-tool.fullname" . }}-github-token
                  key: GITHUB_TOKEN
            - name: LOG_FORMAT
              value: {{ .Values.env.logFormat | quote }}
            - name: PORT
              value: {{ .Values.env.port | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
