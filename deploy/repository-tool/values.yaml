replicaCount: 1

image:
  repository: repository-tool
  tag: latest
  pullPolicy: Never  # Using kind with pre-loaded images

service:
  type: NodePort
  port: 8080
  nodePort: 30080

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "200m"

# Plain string env vars injected into the container.
# Add any KEY: "value" pair here and it will be picked up automatically;
# no template change required.
env:
  LOG_FORMAT: "json"
  PORT: "8080"

# Secret-backed env vars. Each KEY: value pair becomes both a key in the
# chart-managed Secret AND a secretKeyRef env var on the Deployment.
# Override at install time, e.g.:
#   helm install ... --set secrets.GITHUB_TOKEN=ghp_xxx
secrets:
  GITHUB_TOKEN: ""

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
